<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alts mini</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; padding: 0 !important; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.4 Geist, "Segoe UI", system-ui, sans-serif; }
  #mini { display: flex; flex-direction: column; height: 100%; border: 1px solid var(--border); box-sizing: border-box; }
  /* attached: no border on the side that touches the Riot Client */
  body.docked #mini { border-left: 0; }
  .mhd { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 12px; -webkit-app-region: drag; user-select: none; }
  .mhd b { flex: 1; font-size: 13px; }
  .mhd button { -webkit-app-region: no-drag; }
  .mhd .mark { width: 24px; height: 24px; border-radius: 7px; }
  .note { margin: 0 12px 8px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .note .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .note .dot.on { background: var(--good); }
  .msearch { margin: 0 12px 10px; display: flex; width: auto; min-width: 0; }
  .msearch input { flex: 1; min-width: 0; width: auto; height: 34px; }
  .active { margin: 0 12px 10px; padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--accent); display: flex; flex-direction: column; gap: 10px; }
  .active .row1 { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .active .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 14px 6px; }
  .list { flex: 1; overflow-y: auto; padding: 0 6px 8px; }
  .it { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; cursor: pointer; min-width: 0; }
  .it:hover, .it:focus-visible { background: var(--surface); outline: none; }
  .it .who { flex: 1; min-width: 0; }
  .it .nm { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .rk { font-size: 12px; font-weight: 600; }
  .it .acts { display: none; gap: 4px; }
  .it:hover .acts, .it:focus-within .acts { display: flex; }
  .mft { padding: 8px 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .locked { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; }
</style>
</head>
<body>
<div id="mini"></div>
<div id="toasts" aria-live="polite"></div>
<script src="mini.js"></script>
</body>
</html>
